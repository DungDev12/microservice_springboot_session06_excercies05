spring:
    application:
        name: api-gateway

    cloud:
      gateway:
        server:
            webflux:
                routes:
                    - id: patient-server
                      uri: lb://PATIENT-SERVICE
                      predicates:
                        - Path=/api/v1/patients/**

                    - id: doctor-service
                      uri: lb://DOCTOR-SERVICE
                      predicates:
                        - Path=/api/v1/doctors/**

                    - id: appointment-service
                      uri: lb://APPOINTMENT-SERVICE
                      predicates:
                        - Path=/api/v1/appointments/**

server:
    port: 8080

eureka:
    client:
        service-url:
          defaultZone: http://localhost:8761/eureka/

